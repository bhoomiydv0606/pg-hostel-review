<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PG Hostel Review | Professional Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #2563eb;
        --color-primary-light: #dbeafe;
        --color-bg-dark: #0f172a;
        --color-glass: rgba(255, 255, 255, 0.08);
        --font-headline: 'Poppins', sans-serif;
        --font-body: 'Poppins', sans-serif;
        --font-alt: 'Poppins', sans-serif;
        --color-ebony: #1e293b;
        --color-bone: #f8fafc;
        --color-coral: #f59e0b;
        --color-sage: #10b981;
        --color-muted: #64748b;
      }
      body {
        margin: 0;
        background-color: var(--color-bg-dark);
        color: #fff;
        font-family: var(--font-body);
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Load Google Maps only if API key is configured in .env.local
      (function() {
        var key = '%VITE_GOOGLE_MAPS_API_KEY%';
        if (key && !key.includes('VITE_GOOGLE_MAPS')) {
          var s = document.createElement('script');
          s.src = 'https://maps.googleapis.com/maps/api/js?key=' + key + '&libraries=places';
          s.async = true; s.defer = true;
          document.head.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
